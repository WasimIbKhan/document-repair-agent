[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toc-repair"
version = "0.1.0"
description = "Repair the table of contents of an already-parsed PDF"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pymupdf>=1.24",
    "rapidfuzz",
    "mcp>=2.3",
    "claude-agent-sdk>=0.2.163",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
toc-repair-build-layout = "toc_repair.build_layout:main"
toc-repair-gt = "toc_repair.ground_truth:main"
toc-repair-tool = "toc_repair.tool_cli:main"
toc-repair-agent = "toc_repair.agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
